# Builds an installable Android APK (Capacitor wrapper around docs/) and
# publishes it on the "android-latest" release.
name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - 'capacitor.config.json'
      - 'tools/android-prepare.py'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web files for the app (WebP atlases only; PNGs are a browser fallback)
        run: |
          mkdir -p build && cp -r docs build/android-www
          find build/android-www/sprites -name '*.png' -delete
          rm -f build/android-www/sw.js build/android-www/.nojekyll
          du -sh build/android-www
      - name: Generate the Android project
        run: |
          npm i --no-save --no-audit --no-fund @capacitor/cli@8 @capacitor/core@8 @capacitor/android@8
          npx cap add android
          pip install pillow
          python3 tools/android-prepare.py
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StickArenaReborn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StickArenaReborn-apk
          path: StickArenaReborn.apk
      - name: Publish on the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Telefona yükle: StickArenaReborn.apk dosyasını indir, aç ve "bilinmeyen kaynaklardan yükleme" iznini ver.
            Install: download StickArenaReborn.apk on your phone and open it (allow installs from unknown sources).
            Built from ${{ github.sha }}.
          files: StickArenaReborn.apk
