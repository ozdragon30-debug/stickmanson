# Builds an installable Android APK (Capacitor wrapper around docs/) and
# publishes it on the "android-latest" release.
name: Android APK
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Build an older version (commit) as a separate side-by-side app; empty = current'
        required: false
        default: ''
  push:
    paths:
      - 'docs/**'
      - 'capacitor.config.json'
      - 'tools/android-prepare.py'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Older version as a separate app (manual runs with a ref)
        if: ${{ github.event.inputs.ref != '' && github.event.inputs.ref != null }}
        run: |
          REF='${{ github.event.inputs.ref }}'
          # Replace (not overlay) the web files and tools with that version's.
          rm -rf docs tools
          git checkout "$REF" -- docs tools capacitor.config.json
          SHORT=$(git rev-parse --short=7 "$REF")
          # Own app id and name, so it installs next to the current game.
          python3 - <<'PY'
          import json
          c = json.load(open('capacitor.config.json'))
          c['appId'] = 'io.github.stickarena.classic'
          c['appName'] = 'Stick Arena Eski'
          json.dump(c, open('capacitor.config.json', 'w'), indent=2)
          PY
          echo "OLD_APK=StickArena-eski-$SHORT.apk" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web files for the app (WebP atlases only; PNGs are a browser fallback)
        run: |
          mkdir -p build && cp -r docs build/android-www
          find build/android-www/sprites -name '*.png' -delete
          rm -f build/android-www/sw.js build/android-www/.nojekyll
          du -sh build/android-www
      - name: Generate the Android project
        run: |
          npm i --no-save --no-audit --no-fund @capacitor/cli@8 @capacitor/core@8 @capacitor/android@8
          npx cap add android
          pip install pillow
          python3 tools/android-prepare.py
          npx cap sync android
      - name: Use the repo's fixed debug signing key
        # Same signature on every build, so a new APK installs over the old one.
        # (A debug key: fine for sideloading, not for the Play Store.)
        run: mkdir -p ~/.android && cp tools/android-debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename
        # StickClash.apk is always the newest build; every build is also kept
        # as StickClash-<commit>.apk so any older version can be reinstalled.
        run: |
          if [ -n "$OLD_APK" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OLD_APK"
            echo "MAIN_APK=$OLD_APK" >> "$GITHUB_ENV"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk StickClash.apk
            cp StickClash.apk "StickClash-${GITHUB_SHA::7}.apk"
            echo "MAIN_APK=StickClash.apk" >> "$GITHUB_ENV"
            echo "COPY_APK=StickClash-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: StickClash-apk
          path: ${{ env.MAIN_APK }}
      - name: Publish on the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Telefona yükle: StickClash.apk dosyasını indir, aç ve "bilinmeyen kaynaklardan yükleme" iznini ver.
            Install: download StickClash.apk on your phone and open it (allow installs from unknown sources).
            Built from ${{ github.sha }}.
            Older builds: StickClash-<commit>.apk (each build is kept, so you can go back).
          files: |
            ${{ env.MAIN_APK }}
            ${{ env.COPY_APK }}
