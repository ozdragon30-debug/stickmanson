name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the parity test compares against the original import commit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in app.js $(find docs/js -name '*.js') docs/sw.js; do node --check "$f"; done
      - run: npm run lint
      - run: npm test
      - name: Browser smoke test
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Gameplay parity with the original game
        run: npm run parity
