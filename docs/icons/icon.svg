<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#101216"/>
    </radialGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".35" stop-color="#ffb43a"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#8e979f"/>
      <stop offset=".5" stop-color="#e8edf1"/>
      <stop offset="1" stop-color="#7d868e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0" stop-color="#7a4a22"/>
      <stop offset=".5" stop-color="#c88a4c"/>
      <stop offset="1" stop-color="#6a3c18"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- crossed weapons: a blade and a bat clashing above the head -->
  <g stroke="#0b0c0f" stroke-width="7" stroke-linejoin="round">
    <g transform="rotate(-40 256 190)">
      <path d="M244 52 L268 52 L272 330 L240 330 Z" fill="url(#steel)"/>
      <rect x="222" y="326" width="68" height="16" rx="6" fill="#c9a24a"/>
      <rect x="246" y="342" width="20" height="74" rx="6" fill="#23262c"/>
    </g>
    <g transform="rotate(40 256 190)">
      <path d="M238 60 Q256 46 274 60 L268 300 L262 410 L250 410 L244 300 Z" fill="url(#wood)"/>
      <rect x="246" y="356" width="20" height="58" rx="5" fill="#23262c"/>
    </g>
  </g>
  <circle cx="256" cy="186" r="96" fill="url(#spark)"/>
  <g fill="#ffd27a">
    <path d="M256 106 L265 176 L256 164 L247 176 Z"/>
    <path d="M176 186 L240 178 L229 186 L240 194 Z"/>
    <path d="M336 186 L272 194 L283 186 L272 178 Z"/>
  </g>
  <!-- stick figure head + shoulders -->
  <path d="M118 512 Q130 400 256 392 Q382 400 394 512 Z" fill="#0b0c0f"/>
  <circle cx="256" cy="318" r="74" fill="#0b0c0f" stroke="#101216" stroke-width="8"/>
  <ellipse cx="228" cy="290" rx="22" ry="14" transform="rotate(-35 228 290)" fill="#ffffff" opacity=".14"/>
</svg>
